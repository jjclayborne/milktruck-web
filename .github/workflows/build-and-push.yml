name: Build and Push

on:
  workflow_call:
    inputs:
      app_name:
        description: Fly.io app name
        required: true
        type: string
      image_tag:
        description: Docker image tag (git SHA)
        required: true
        type: string
    outputs:
      image_ref:
        description: Full image reference pushed to registry.fly.io
        value: ${{ jobs.build.outputs.image_ref }}


jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image-ref.outputs.image_ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly.io registry
        uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Set image reference
        id: image-ref
        run: echo "image_ref=registry.fly.io/${{ inputs.app_name }}:${{ inputs.image_tag }}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            registry.fly.io/${{ inputs.app_name }}:${{ inputs.image_tag }}
            registry.fly.io/${{ inputs.app_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
