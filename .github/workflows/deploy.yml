# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Deploy

on:
  workflow_call:
    inputs:
      app_name:
        description: Fly.io app name
        required: true
        type: string
      image_ref:
        description: Full Docker image reference to deploy
        required: true
        type: string
      fly_config:
        description: Path to the fly.toml config file
        required: false
        type: string
        default: fly.toml
      environment:
        description: GitHub deployment environment name
        required: false
        type: string
        default: production

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: |
          flyctl deploy \
            --app ${{ inputs.app_name }} \
            --image ${{ inputs.image_ref }} \
            --config ${{ inputs.fly_config }} \
            --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
